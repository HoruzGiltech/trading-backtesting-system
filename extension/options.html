<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>GM Ledger Sync</title>
  <style>
    :root { --bg:#12151C; --surface:#1B2029; --border:#2A303C; --text:#E8E6E0; --muted:#9AA0AC; --accent:#C9A15C; --win:#4FAE8E; --loss:#C1554B; }
    body { margin:0; min-width:340px; background:var(--bg); color:var(--text); font:14px system-ui, sans-serif; }
    main { padding:16px; max-width:480px; }
    h1 { font-size:16px; margin:0 0 4px; } h1 span { color:var(--accent); }
    p { color:var(--muted); margin:0 0 14px; font-size:12px; }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input { width:100%; box-sizing:border-box; background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:8px; color:var(--text); font-family:ui-monospace, monospace; }
    input:focus { outline:none; border-color:var(--accent); }
    button { margin-top:14px; background:var(--accent); color:var(--bg); border:0; border-radius:4px; padding:8px 14px; font-weight:600; cursor:pointer; }
    button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
    #status { margin-top:14px; padding:10px; border:1px solid var(--border); border-radius:4px; font-size:12px; }
    .ok { color:var(--win); } .err { color:var(--loss); }
  </style>
</head>
<body>
  <main>
    <h1>GM <span>Ledger</span> Sync</h1>
    <p>Deja abierta la pestaña "Posiciones cerradas" en FundingPips y cada operación cerrada se registrará en tu Diario.</p>

    <label for="apiUrl">URL de la API (backend en Railway)</label>
    <input id="apiUrl" placeholder="https://tu-backend.up.railway.app" />

    <label for="apiToken">Token de la extensión (GM Ledger → Diario → Generar token)</label>
    <input id="apiToken" type="password" placeholder="gml_..." />

    <label for="accountSize">Tamaño de cuenta (para calcular el %)</label>
    <input id="accountSize" type="number" step="0.01" placeholder="10000" />

    <button id="save">Guardar</button>
    <button id="test" class="secondary">Probar conexión</button>

    <div id="status">Sin sincronizaciones todavía.</div>
  </main>
  <script src="options.js"></script>
</body>
</html>
